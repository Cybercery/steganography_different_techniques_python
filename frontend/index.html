<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steganography Lab - Hide & Extract Secret Messages</title>
    <meta
      name="description"
      content="Advanced steganography tool to embed and extract hidden messages in images using LSB, DCT, DWT, and hybrid algorithms"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="theme-toggle">
      <button id="themeToggle" class="btn-icon" aria-label="Toggle theme">
        <svg
          class="sun-icon"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="10" cy="10" r="4"></circle>
          <path
            d="M10 1v2m0 14v2M19 10h-2M3 10H1m15.07-6.93l-1.41 1.41M5.34 14.66l-1.41 1.41m12.14 0l-1.41-1.41M5.34 5.34L3.93 3.93"
          ></path>
        </svg>
        <svg
          class="moon-icon"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"></path>
        </svg>
      </button>
    </div>

    <div class="container">
      <header
        class="header"
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        "
      >
        <div class="logo" style="margin-bottom: 8px">
          <img
            src="logo.png"
            alt="logo"
            width="50"
            height="50"
            style="object-fit: contain; display: block"
          />
        </div>
        <h1 style="margin: 0">Steganography Lab</h1>
        <p class="subtitle" style="margin: 4px 0 0">
          Advanced image steganography with multiple embedding algorithms
        </p>
      </header>

      <div class="tabs">
        <style>
          :root {
            --tab-text-light: #333333; /* dark gray for light mode */
            --tab-text-dark: #ffffff; /* white for dark mode */
          }
          /* default (light) */
          .tab-btn {
            color: var(--tab-text-light);
            background: transparent;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px;
            min-height: 48px;
            min-width: 160px;
          }
          .tab-btn .tab-text {
            color: inherit;
            font-weight: 600;
          }

          /* enlarge svgs inside buttons */
          .tab-btn svg {
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
          }

          /* system dark mode */
          @media (prefers-color-scheme: dark) {
            .tab-btn {
              color: var(--tab-text-dark);
            }
          }

          /* explicit dark class on body (if your theme toggle adds it) */
          body.dark .tab-btn {
            color: var(--tab-text-dark);
          }

          /* responsive: slightly smaller tabs on narrow screens */
          @media (max-width: 480px) {
            .tab-btn {
              gap: 8px;
              padding: 10px 12px;
              font-size: 14px;
              min-width: 120px;
              min-height: 44px;
            }
            .tab-btn svg {
              width: 20px;
              height: 20px;
              flex: 0 0 20px;
            }
          }
        </style>

        <button class="tab-btn active" data-tab="embed">
          <svg
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14m-6-7h14"></path>
          </svg>
          <span class="tab-text">Embed Message</span>
        </button>
        <button class="tab-btn" data-tab="extract">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <!-- tray / base -->
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path>
            <!-- arrow pointing up into the tray -->
            <polyline points="8 11 12 7 16 11"></polyline>
            <line x1="12" y1="7" x2="12" y2="19"></line>
          </svg>
          <span class="tab-text">Extract Message</span>
        </button>
      </div>

      <div class="tab-content active" id="embed-tab">
        <form id="embedForm" class="form">
          <div class="form-group">
            <label class="form-label">Select Cover Image</label>
            <div class="file-input-wrapper">
              <input
                type="file"
                id="embedFile"
                accept="image/*"
                class="file-input"
                required
              />
              <label for="embedFile" class="file-label">
                <svg
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5-5-5 5m5-5v12"
                  ></path>
                </svg>
                <span>Choose Image</span>
              </label>
              <span class="file-name" id="embedFileName">No file selected</span>
            </div>
            <div class="image-preview" id="embedPreview"></div>
          </div>

          <div class="form-group">
            <label for="message" class="form-label">Secret Message</label>
            <textarea
              id="message"
              class="form-control"
              rows="4"
              placeholder="Enter your secret message here..."
              required
            ></textarea>
            <div class="char-count">
              <span id="charCount">0</span> characters
            </div>
          </div>

          <div class="form-group">
            <label for="algorithm" class="form-label"
              >Steganography Algorithm</label
            >
            <select id="algorithm" class="form-control" required>
              <option value="lsb">LSB (Least Significant Bit)</option>
              <option value="lsb_matching">LSB Matching</option>
              <option value="dct">DCT (Discrete Cosine Transform)</option>
              <option value="dwt">DWT (Discrete Wavelet Transform)</option>
              <option value="hybrid">Hybrid (DWT + DCT)</option>
            </select>
            <div class="algorithm-info" id="algoInfo"></div>
          </div>

          <button type="submit" class="btn btn--primary btn--full-width">
            <svg
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 1v12m-4-4l4 4 4-4M1 13v6a2 2 0 002 2h14a2 2 0 002-2v-6"
              ></path>
            </svg>
            Embed Message
          </button>
        </form>

        <div class="results" id="embedResults" style="display: none">
          <h3>Embedding Results</h3>
          <div class="metrics-grid">
            <div class="metric-card">
              <div class="metric-label">MSE</div>
              <div class="metric-value" id="mseValue">-</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">PSNR</div>
              <div class="metric-value" id="psnrValue">-</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">SSIM</div>
              <div class="metric-value" id="ssimValue">-</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Time</div>
              <div class="metric-value" id="timeValue">-</div>
            </div>
          </div>
          <div class="result-actions">
            <button id="downloadBtn" class="btn btn--primary">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m4-5l5 5 5-5m-5 5V3"
                ></path>
              </svg>
              Download Stego Image
            </button>
          </div>
        </div>
      </div>

      <div class="tab-content" id="extract-tab">
        <form id="extractForm" class="form">
          <div class="form-group">
            <label class="form-label">Select Stego Image</label>
            <div class="file-input-wrapper">
              <input
                type="file"
                id="extractFile"
                accept="image/*"
                class="file-input"
                required
              />
              <label for="extractFile" class="file-label">
                <svg
                  width="24"
                  height="24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4m14-7l-5-5-5 5m5-5v12"
                  ></path>
                </svg>
                <span>Choose Stego Image</span>
              </label>
              <span class="file-name" id="extractFileName"
                >No file selected</span
              >
            </div>
            <div class="image-preview" id="extractPreview"></div>
          </div>

          <div class="form-group">
            <label for="extractAlgorithm" class="form-label"
              >Extraction Algorithm</label
            >
            <select id="extractAlgorithm" class="form-control" required>
              <option value="lsb">LSB (Least Significant Bit)</option>
              <option value="lsb_matching">LSB Matching</option>
              <option value="dct">DCT (Discrete Cosine Transform)</option>
              <option value="dwt">DWT (Discrete Wavelet Transform)</option>
              <option value="hybrid">Hybrid (DWT + DCT)</option>
            </select>
          </div>

          <button type="submit" class="btn btn--primary btn--full-width">
            <svg
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 13V1m-4 4l4-4 4 4M1 13v6a2 2 0 002 2h14a2 2 0 002-2v-6"
              ></path>
            </svg>
            Extract Message
          </button>
        </form>

        <div class="results" id="extractResults" style="display: none">
          <h3>Extracted Message</h3>
          <div class="extracted-message">
            <div class="message-box" id="extractedMessage"></div>
            <button id="copyBtn" class="btn btn--secondary">
              <svg
                width="18"
                height="18"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path
                  d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"
                ></path>
              </svg>
              Copy to Clipboard
            </button>
          </div>
        </div>
      </div>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Processing...</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
